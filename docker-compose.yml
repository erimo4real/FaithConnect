services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bethel_church
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d bethel_church"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://Admin:admin@db:5432/bethel_church
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
